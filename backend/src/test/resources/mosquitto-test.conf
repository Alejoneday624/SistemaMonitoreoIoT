# Config del Mosquitto de pruebas (espejo de mosquitto/mosquitto.conf):
# listener en todas las interfaces (para salir del contenedor), anonimo,
# persistencia de sesiones y mensajes + autosave corto, para poder parar y
# arrancar el broker en los tests y comprobar que no se pierde nada.
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
max_queued_messages 10000
