spring.application.name=monitoring

# Conexion a PostgreSQL
# Los valores por defecto permiten correr en local; en Docker se
# sobrescriben con las variables de entorno del docker-compose.yml.
# Para usar Supabase (u otra base remota) basta con definir
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD en el archivo .env.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campusiot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Puerto del servidor (en Docker se expone 8080 dentro del contenedor)
server.port=${SERVER_PORT:8080}

# Portada: GET / redirige al tablero React en vez de mostrar la pagina
# Whitelabel de error ("This application has no explicit mapping for /error")
panel.url=${PANEL_URL:http://localhost:8080}

# Access log de Tomcat: deja registrado que rutas se pidieron (util para
# diagnosticar 404). Se escribe en /tmp porque el contenedor corre como
# appuser y /app pertenece a root: leer con
#   docker exec campusiot-backend sh -c "tail -f /tmp/access_log.*.log"
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/tmp

# Actuator
management.endpoints.web.exposure.include=health,info

# ---------------------------------------------------------------
# MQTT (broker Mosquitto) — estilo Pub/Sus (§4.2 del documento)
# En Docker lo inyecta docker-compose; en local usa localhost:1883
# ---------------------------------------------------------------
mqtt.url=${MQTT_URL:tcp://localhost:1883}

# Frecuencia de publicacion del simulador de sensores (Tabla 1)
sensor.frecuencia-ms=${SENSOR_FRECUENCIA_MS:5000}

# Ronda 2 — listos para usar (HDU-04 y HDU-06)
heartbeat.segundos=${HEARTBEAT_SEGUNDOS:120}
alerta.umbral-ppm=${UMBRAL_PPM:900}
