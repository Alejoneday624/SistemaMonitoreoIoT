spring.application.name=monitoring

# Conexion a PostgreSQL
# Los valores por defecto permiten correr en local; en Docker se
# sobrescriben con las variables de entorno del docker-compose.yml.
# Para usar Supabase (u otra base remota) basta con definir
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD en el archivo .env.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campusiot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Puerto del servidor (en Docker se expone 8080 dentro del contenedor).
# Render inyecta PORT (10000 para la URL publica): sin leerlo aqui la app
# quedaria escuchando en 8080 y el servicio no responderia.
server.port=${PORT:${SERVER_PORT:8080}}

# Portada: GET / redirige al tablero React en vez de mostrar la pagina
# Whitelabel de error ("This application has no explicit mapping for /error")
panel.url=${PANEL_URL:http://localhost:8080}

# Origenes permitidos para CORS (solo aplica si el frontend llama al backend
# EN ABSOLUTO con VITE_API_URL en vez de usar los rewrites de vercel.json).
# Admite comodines: https://*.vercel.app cubre cualquier preview de Vercel.
panel.cors-origins=${CORS_ORIGINS:https://*.vercel.app,http://localhost:5173}

# Access log de Tomcat: deja registrado que rutas se pidieron (util para
# diagnosticar 404). Se escribe en /tmp porque el contenedor corre como
# appuser y /app pertenece a root: leer con
#   docker exec campusiot-backend sh -c "tail -f /tmp/access_log.*.log"
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/tmp

# Actuator
management.endpoints.web.exposure.include=health,info

# ---------------------------------------------------------------
# MQTT (broker Mosquitto) — estilo Pub/Sus (§4.2 del documento)
# En Docker lo inyecta docker-compose; en local usa localhost:1883
# ---------------------------------------------------------------
mqtt.url=${MQTT_URL:tcp://localhost:1883}

# Frecuencia de publicacion del simulador de sensores (Tabla 1)
sensor.frecuencia-ms=${SENSOR_FRECUENCIA_MS:5000}

# Ronda 2 — listos para usar (HDU-04 y HDU-06)
heartbeat.segundos=${HEARTBEAT_SEGUNDOS:120}
alerta.umbral-ppm=${UMBRAL_PPM:900}

# ---------------------------------------------------------------
# Colas duraderas por servicio (E9/E11) — tabla cola_mensajes
# Si el broker se cae, la cola de salida retiene todo hasta reconectar;
# si el servicio se cae, la cola de entrada se reprocesa al arrancar.
# Estan en PostgreSQL porque en Render el disco es efimero.
# ---------------------------------------------------------------
# Tope de una cola: al llegar ahi se descartan los mensajes mas viejos
cola.max-pendientes=${COLA_MAX_PENDIENTES:5000}
# Reintentos de procesamiento antes de marcar un mensaje FALLIDO
cola.reintentos-max=${COLA_REINTENTOS_MAX:5}
# Red de seguridad: cada cuantos ms se vuelve a intentar vaciar las colas
cola.tick-ms=${COLA_TICK_MS:10000}
# Dias que se conservan los FALLIDO antes de purgarlos
cola.fallidos-dias=${COLA_FALLIDOS_DIAS:7}
