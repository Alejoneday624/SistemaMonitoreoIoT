# Mosquitto 2 — Broker MQTT del prototipo Campus IoT
# Pub/Sus: estilo arquitectónico principal (§4.2 del documento)

# Escucha en todas las interfaces (red Docker interna + puerto 1883 del host
# para poder inspeccionar con mosquitto_sub durante la demo)
listener 1883 0.0.0.0
allow_anonymous true

# Persistencia de sesiones y mensajes:
# con QoS 1 y sesiones no limpias (cleanSession=false), si un suscriptor se
# cae el broker conserva los mensajes pendientes hasta que vuelva (táctica E9/E11)
persistence true
persistence_location /mosquitto/data/
